name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, tests and deterministic artifacts
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Detect stale committed artifacts
        shell: pwsh
        run: |
          git diff --exit-code -- dist manifest.json manifest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

